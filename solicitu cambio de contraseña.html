<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/style.css">
  <title>solicitud cambio de contraseña</title>
</head>

<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner">Cargando...</div>
  </div>
  <!-- Header -->
  <header>
    <button class="toggle-button" id="toggle-button">☰</button>
    <img src="assets/img/logo.png" alt="Logo de la empresa" class="logo">
    <nav>

  <!-- Main content -->
  <div class="login-container">

    <form id="login-form" action="/#" method="POST">
      <h1>recuperar contraseña </h1>
      <div class="validation-message" id="message-from-server">
        <p></p>
      </div>

      <div class="form-group">
        <label for="username">Usuario o correo electronico:</label>
        <input type="text" id="username" name="username" placeholder="Usuario o correo electronico" required>
      </div>

     
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" id="show-password" name="show-password">
        <label for="show-password">Show Password</label>
      </div>

      <button type="submit">enviar enlace de recuperacion </button>
    </form>

  </div>
